# Render deployment configuration for CodeGuard AI v2.1
services:
  - type: web
    name: codeguard-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install --legacy-peer-deps && GENERATE_SOURCEMAP=false npm run build && cd ..
    # --proxy-headers is required so rate limiting sees real client IPs (X-Forwarded-For)
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GLM_API_KEY
        sync: false  # enter your OpenRouter API key in the Render dashboard
      - key: GLM_API_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: GLM_MODEL
        value: z-ai/glm-4.7-flash
      - key: CORS_ORIGINS
        value: ""     # same-origin only (frontend served by this service)
      # ── Security (all required in production) ──────────────────
      - key: CG_API_TOKEN
        sync: false  # REQUIRED — set a long random value. Generate:
                     #   python -c "import secrets; print(secrets.token_hex(32))"
                     # Comma-separate multiple keys for rotation:
                     #   key1,key2
      - key: REQUIRE_API_AUTH
        value: "true"  # set "false" ONLY for local development
      - key: DOCS_ENABLED
        value: "false"  # /docs, /redoc, /openapi.json return 404 in production
      - key: SHARE_SECRET
        sync: false  # REQUIRED — stable HMAC secret for share links.
                     # Generate: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SHARE_TTL_SECONDS
        value: "86400"
      # ── Rate limiting (optional — in-memory fallback works for single instance) ──
      - key: REDIS_URL
        sync: false  # e.g. redis://red-xxxx.upstash.io:6379 for multi-instance / persistent
